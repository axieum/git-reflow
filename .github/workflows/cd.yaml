# Prepares and releases the project

name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ "completed" ]
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    concurrency:
      group: git-reflow-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⬇️ Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: |
            git-cliff@2.14

      - name: 🏗️ Install git-reflow
        shell: bash
        run: |
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: 🙌 Prepare release
        id: git-reflow
        shell: bash
        env:
          COMMAND: ""
          CONFIG: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/action.sh

    outputs:
      prs: ${{ steps.git-reflow.outputs.prs }}
      pr: ${{ steps.git-reflow.outputs.pr }}
      releases: ${{ steps.git-reflow.outputs.releases }}
      release: ${{ steps.git-reflow.outputs.release }}

  publish:
    name: Publish

    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.result == 'success' && needs.release.outputs.releases != '[]' }}

    concurrency:
      group: git-reflow-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v7

      - name: 🦀 Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --dry-run
