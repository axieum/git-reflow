# Prepares and releases the project

name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ "completed" ]
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    concurrency:
      group: git-reflow-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⬇️ Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: |
            git-cliff@2.14

      - name: 🏗️ Install git-reflow
        shell: bash
        run: |
          cargo build --locked --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: 🙌 Prepare release
        id: git-reflow
        shell: bash
        env:
          COMMAND: ""
          CONFIG: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/action.sh

      - name: 🔎 Did binary release?
        id: binary-release
        shell: bash
        env:
          RELEASES: ${{ steps.git-reflow.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.[] | select(.["package-name"] == "git-reflow") | .["tag-name"]' <<< "$RELEASES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

    outputs:
      prs: ${{ steps.git-reflow.outputs.prs }}
      pr: ${{ steps.git-reflow.outputs.pr }}
      releases: ${{ steps.git-reflow.outputs.releases }}
      release: ${{ steps.git-reflow.outputs.release }}
      binary-tag: ${{ steps.binary-release.outputs.tag }}

  publish:
    name: Publish

    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.result == 'success' && needs.release.outputs.releases != '[]' }}

    concurrency:
      group: git-reflow-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v7

      - name: 🦀 Publish crates
        shell: bash
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          packages=$(jq -er '.[] | "--package", .["package-name"]' <<< "$RELEASES")
          mapfile -t args <<< "$packages"
          echo "$ cargo publish --locked ${args[*]}"
          cargo publish --locked "${args[@]}"

  upload-assets:
    name: Upload assets

    strategy:
      matrix:
        include:
          - { target: "x86_64-unknown-linux-gnu", os: "ubuntu-latest" }
          - { target: "x86_64-apple-darwin", os: "macos-latest" }
          - { target: "x86_64-pc-windows-msvc", os: "windows-latest" }

    needs: [release, publish]
    runs-on: ${{ matrix.os }}
    if: ${{ needs.release.outputs.binary-tag != '' }}

    permissions:
      contents: write

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.binary-tag }}
          fetch-depth: 0

      - name: ⬆️ Upload binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          package: git-reflow
          bin: git-reflow
          ref: refs/tags/${{ needs.release.outputs.binary-tag }}
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
