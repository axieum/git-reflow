[package]
name = "git-reflow-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
git-reflow-api = { path = "../git-reflow-api" }
anyhow = "1.0.104"
tracing = "0.1.44"
clap = { version = "4.6.6", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
git2 = "0.21.0"
insta = { version = "1.48.0", features = ["filters"] }
rstest = "0.26.1"
