[package]
name = "git-reflow-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
config = { version = "0.15.25", features = ["json", "json5", "toml", "yaml"] }
git2 = "0.21.0"
glob = "0.3.4"
octocrab = "0.54.2"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"

[dev-dependencies]
assert_fs = "1.1.4"
mockall = "0.15.0"
rstest = "0.26.1"
