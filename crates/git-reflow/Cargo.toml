[package]
name = "git-reflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "git-reflow"
path = "src/main.rs"

[dependencies]
git-reflow-api = { path = "../git-reflow-api", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
git2 = "0.21.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
git-reflow-fixtures = { path = "../git-reflow-fixtures" }
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
git2 = "0.21.0"
httpmock = "0.9.0"
insta = { version = "1.49.0", features = ["filters"] }
rstest = "0.28.0"
